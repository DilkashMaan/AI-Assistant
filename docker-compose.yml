version: '3.8'

services:
  # ── PostgreSQL Database Container ──────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: ai_assistant_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_assistant_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ai_assistant_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── AI Agent Backend Application Container ───────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_assistant_app
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GOOGLE_SHEET_ID=${GOOGLE_SHEET_ID}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-ai_assistant_db}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - ENABLE_DB=true
      - PYTHONUTF8=1
    volumes:
      # Mount output folder to keep generated CSV & Excel files accessible on host
      - ./output:/app/output

volumes:
  postgres_data:
    driver: local
